{% if profiles %}
<div class="space-y-2">
    {% for profile in profiles %}
    <div class="flex items-center justify-between bg-gray-700/50 px-3 py-2 rounded">
        <div>
            <span class="text-gray-100">{{ profile.name }}</span>
            <span class="text-xs text-gray-500 ml-2">({{ profile.type }})</span>
            {% if profile.imported_from %}
            <span class="text-xs text-gray-600 ml-1">from {{ profile.imported_from }}</span>
            {% endif %}
        </div>
        <button type="button"
                onclick="deleteProfile('{{ profile.name }}', this)"
                class="text-red-400 hover:text-red-300 text-sm px-2 py-1 rounded hover:bg-red-900/30 transition-colors">
            Delete
        </button>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-gray-500 text-sm text-center py-2 italic">
    No imported profiles yet
</div>
{% endif %}
