{% extends "base.html" %}

{% block title %}SCAD Editor - Orca Slicer{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- File List Panel -->
    <div class="lg:col-span-1">
        <div class="bg-gray-800 rounded-lg border border-gray-700 p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-100">SCAD Files</h2>
                <span class="htmx-indicator">
                    <svg class="animate-spin h-5 w-5 text-cyan-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </span>
            </div>

            <!-- File List (HTMX loaded) -->
            <div id="scad-file-list"
                 hx-get="/ui/scad/files"
                 hx-trigger="load"
                 hx-swap="innerHTML"
                 hx-indicator=".htmx-indicator">
                <div class="text-gray-500 text-sm text-center py-4">
                    Loading files...
                </div>
            </div>
        </div>
    </div>

    <!-- Parameter Editor Panel -->
    <div class="lg:col-span-2">
        <div class="bg-gray-800 rounded-lg border border-gray-700 p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-100">Parameter Editor</h2>
                <span id="params-indicator" class="htmx-indicator">
                    <svg class="animate-spin h-5 w-5 text-cyan-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </span>
            </div>

            <!-- Parameter form container -->
            <div id="params-panel">
                <div class="text-gray-500 text-center py-8">
                    <svg class="mx-auto h-12 w-12 text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <p>Select a SCAD file to edit its parameters</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
