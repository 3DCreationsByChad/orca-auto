[project]
name = "orca-api"
version = "0.1.0"
description = "FastAPI backend for OrcaSlicer batch slicing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "trimesh>=4.0.0",
    "python-multipart",
    "aiofiles",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
orca-auto = "orca_cli.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "hardware: requires a real OrcaSlicer install and/or a live Moonraker (deselected by default)",
]
